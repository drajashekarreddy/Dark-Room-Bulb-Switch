<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Room Bulb Switch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="lamp-wrap">
    <div class="cord"></div>
    <div class="glow" id="glow"></div>
    <svg width="260" height="200" viewBox="0 0 260 200">
      <defs>
        <linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a3a3a"/>
          <stop offset="100%" stop-color="#161616"/>
        </linearGradient>
        <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a3a3a"/>
          <stop offset="100%" stop-color="#1a1a1a"/>
        </linearGradient>
        <radialGradient id="globeLit" cx="42%" cy="36%" r="62%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#fffaf0"/>
          <stop offset="100%" stop-color="#fde9bd"/>
        </radialGradient>
      </defs>
 
      <!-- socket cap -->
      <rect x="118" y="0" width="24" height="30" rx="3" fill="url(#capGrad)" stroke="#0a0a0a" stroke-width="1"/>
 
      <!-- glowing globe (behind shade rim so shade overlaps top half) -->
      <circle id="globe-fill" cx="130" cy="95" r="40" fill="#28282a"/>
 
      <!-- conical shade -->
      <path d="M130,25
               L235,80
               C238,84 236,90 230,90
               L30,90
               C24,90 22,84 25,80
               Z"
            fill="url(#shadeGrad)" stroke="#000" stroke-width="1"/>
      <ellipse cx="130" cy="90" rx="100" ry="7" fill="#0d0d0d"/>
    </svg>
  </div>
 
  <div class="switch-area">
    <div class="switch" id="switch" onclick="toggleLight()">
      <div class="knob"></div>
    </div>
    <div class="label" id="label">OFF</div>
  </div>
 
<script src="script.js"></script>
</body>
</html>
